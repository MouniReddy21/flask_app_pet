<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet List</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='pet_list.css') }}">
</head>

<body>
    <h1>Our Pet List</h1>

    <form method="GET" action="{{ url_for('pet_list') }}">
        <label for="species">Filter by Species:</label>
        <select name="species_id" id="species">
            <option value="">All Species</option>
            {% for s in species %}
            <option value="{{ s.id }}" {% if s.id==request.args.get('species_id') %}selected{% endif %}>{{ s.name }}
            </option>
            {% endfor %}
        </select>
        <button type="submit">Filter</button>
    </form>

    <ul>
        {% if pets %}
        {% for pet in pets %}
        <li>
            {{ pet.name }} ({{ pet.species.name }})
            <form action="{{ url_for('edit_pet', pet_id=pet.id) }}" method="GET" style="display:inline;">
                <button type="submit">Edit</button>
            </form>
            <form action="{{ url_for('delete_pet', pet_id=pet.id) }}" method="POST" style="display:inline;">
                <button type="submit"
                    onclick="return confirm('Are you sure you want to delete this pet?');">Delete</button>
            </form>
        </li>
        {% endfor %}
        {% else %}
        <li>No pets available.</li>
        {% endif %}
    </ul>

    <a href="{{ url_for('add_pet') }}">Add Pet</a>
    <a href="{{ url_for('home') }}">Back to Home</a>

</body>

</html>
